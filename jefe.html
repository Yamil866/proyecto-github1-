<!DOCTYPE html>
<html>
<head>
    <title>👽 Rescate a Marvin — Jefe Final</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: Arial; }
        canvas { display: block; background: #000; }
        .ui { position: absolute; top: 10px; left: 15px; color: white; z-index: 10; font-size: 16px; }
        .barra-vida {
            width: 220px; height: 22px; background: #333;
            border: 2px solid #666; border-radius: 5px; margin-top: 5px;
        }
        .vida-jefe {
            height: 100%; width: 100%; background: linear-gradient(90deg, #c00, #f00);
            border-radius: 3px; transition: width 0.3s;
        }
        .volver { position: absolute; top: 10px; right: 15px; color: #aaa; text-decoration: none; font-size: 14px; z-index: 20; }
        .marvin { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); color: #ffeb3b; font-size: 14px; z-index: 10; }

        /* 🟦 BOTONES TÁCTILES PARA CELULAR */
        .controles {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 15;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 8px;
        }
        .boton-control {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            color: white;
            font-size: 24px;
            border: 2px solid #fff;
            touch-action: manipulation;
        }
        .boton-disparo {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 235, 59, 0.6);
            color: #000;
            font-size: 22px;
            border: 3px solid #ffeb3b;
            z-index:15;
            touch-action: manipulation;
        }
    </style>
</head>
