<!DOCTYPE html>
 <html>
 <head>
     <title>Mi página con Pac-Man</title>
     <style>
         body {
             background-color: #1a1a1a;
             font-family: Arial;
             text-align: center;
             padding-top: 80px;
             color: white;
             overflow: hidden;
         }
         h1 {
             color: #ffeb3b;
         }
         .pacman {
             position: absolute;
             width: 60px;
             height: 60px;
             background: #ffeb3b;
             border-radius: 50%;
             animation: recorrer 12s linear infinite;
             z-index: 10;
         }
         .pacman::before, .pacman::after {
             content: '';
             position: absolute;
             background: #1a1a1a;
             width: 0;
             height: 0;
         }
         .pacman::before {
             top: 0;
             left: 30px;
             border-top: 30px solid transparent;
             border-bottom: 30px solid transparent;
             border-right: 30px solid #1a1a1a;
             animation: boca 0.5s ease-in-out infinite;
         }
         @keyframes boca {
             0% { border-right: 30px solid #1a1a1a; }
             50% { border-right: 0px solid #1a1a1a; }
             100% { border-right: 30px solid #1a1a1a; }
         }
         @keyframes recorrer {
             0% { top: 50px; left: 0px; }
             25% { top: 50px; left: calc(100% - 80px); }
             25.1% { top: 50px; left: calc(100% - 80px); transform: scaleX(-1); }
             50% { top: calc(100% - 80px); left: 0px; transform: scaleX(-1); }
             50.1% { top: calc(100% - 80px); left: 0px; transform: scaleX(1); }
             75% { top: 50px; left: calc(100% - 80px); transform: scaleX(1); }
             75.1% { top: 50px; left: calc(100% - 80px); transform: scaleX(-1); }
             100% { top: 50px; left: 0px; transform: scaleX(-1); }
         }
         .punto {
             position: absolute;
             width: 15px;
             height: 15px;
             background: white;
             border-radius: 50%;
         }
     </style>
 </head>
 <body>
     <h1>¡Pac-Man recorre mi página! 🟡👻</h1>
     <p>Miralo cómo va de un lado al otro 😄</p>
     <div class="pacman"></div>
     <!-- Puntitos que se come -->
     <div class="punto" style="top: 65px; left: 150px;"></div>
     <div class="punto" style="top: 65px; left: 300px;"></div>
     <div class="punto" style="top: 65px; left: 450px;"></div>
     <div class="punto" style="top: 65px; left: 600px;"></div>
     <div class="punto" style="top: calc(100% - 65px); left: 150px;"></div>
     <div class="punto" style="top: calc(100% - 65px); left: 300px;"></div>
     <div class="punto" style="top: calc(100% - 65px); left: 450px;"></div>
     <div class="punto" style="top: calc(100% - 65px); left: 600px;"></div>
 </body>
 </html>
