<!DOCTYPE html>
 <html>
 <head>
     <title>Mi página con misterios 🕵️</title>
     <style>
         body {
             background-color: #0b0b2b;
             font-family: Arial, sans-serif;
             text-align: center;
             padding-top: 40px;
             color: white;
             overflow-x: hidden;
             margin: 0;
         }
         h1 {
             color: #ffeb3b;
             font-size: 32px;
             border: 3px solid #ffeb3b;
             padding: 15px;
             display: inline-block;
             border-radius: 15px;
             box-shadow: 0 0 20px #ffeb3b;
             position: relative;
             z-index: 20;
         }
         img {
             max-width: 400px;
             border-radius: 15px;
             margin: 20px auto;
             display: block;
             border: 4px solid #90EE90;
             box-shadow: 0 0 15px rgba(144, 238, 144, 0.5);
             position: relative;
             z-index: 20;
         }
         .ovni {
             position: absolute;
             font-size: 50px;
             animation: volar 15s linear infinite;
             z-index: 10;
         }
         @keyframes volar {
             0% { top: 50px; left: 0px; }
             25% { top: 100px; left: calc(100% - 70px); }
             50% { top: calc(100% - 150px); left: calc(100% - 70px); }
             75% { top: calc(100% - 150px); left: 0px; }
             100% { top: 50px; left: 0px; }
         }
         .luz {
             position: absolute;
             width: 8px;
             height: 8px;
             background-color: #90EE90;
             border-radius: 50%;
             animation: parpadear 2s alternate infinite;
             z-index: 5;
         }
         .cometa {
             position: absolute;
             width: 3px;
             height: 60px;
             background: linear-gradient(to bottom, rgba(255,255,255,0.9), transparent);
             border-radius: 50%;
             opacity: 0;
             z-index: 6;
             transform: rotate(45deg);
         }
         @keyframes cruzarCometa {
             0% {
                 transform: rotate(45deg) translateX(-50px);
                 opacity: 0;
             }
             15% { opacity: 1; }
             85% { opacity: 1; }
             100% {
                 transform: rotate(45deg) translateX(calc(100vw + 100px));
                 opacity: 0;
             }
         }
         @keyframes parpadear {
             0% { opacity: 0.2; }
             100% { opacity: 1; }
         }
         .boton-secreto {
             background: linear-gradient(45deg, #4a00e0, #8e2de2);
             color: white;
             border: none;
             padding: 12px 25px;
             margin: 10px;
             font-size: 16px;
             border-radius: 10px;
             cursor: pointer;
             transition: all 0.3s ease;
             border: 2px solid transparent;
             position: relative;
             z-index: 20;
         }
         .boton-secreto:hover {
             transform: scale(1.1);
             box-shadow: 0 0 20px #8e2de2;
             border-color: #fff;
         }
         .caja-secreta {
             background: rgba(255, 255, 255, 0.1);
             border: 2px solid #ffeb3b;
             border-radius: 15px;
             padding: 20px;
             margin: 20px auto;
             max-width: 500px;
             display: none;
             animation: aparecer 0.5s ease;
             position: relative;
             z-index: 20;
         }
         @keyframes aparecer {
             from { opacity: 0; transform: translateY(20px); }
             to { opacity: 1; transform: translateY(0); }
         }
         .contenedor-grafico {
             background: rgba(255, 255, 255, 0.05);
             border: 2px solid #4CAF50;
             border-radius: 15px;
             padding: 20px;
             margin: 20px auto;
             max-width: 600px;
             position: relative;
             z-index: 20;
         }
