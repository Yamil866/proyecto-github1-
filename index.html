<!DOCTYPE html>
<html>
<head>
    <title>Mi página con misterios 🕵️</title>
    <style>
        body {
            background-color: #0b0b2b;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
            color: white;
            overflow-x: hidden;
            margin: 0;
        }

        h1 {
            color: #ffeb3b;
            font-size: 32px;
            border: 3px solid #ffeb3b;
            padding: 15px;
            display: inline-block;
            border-radius: 15px;
            box-shadow: 0 0 20px #ffeb3b;
            position: relative;
            z-index: 20;
        }

        img {
            max-width: 400px;
            border-radius: 15px;
            margin: 20px auto;
            display: block;
            border: 4px solid #90EE90;
            box-shadow: 0 0 15px rgba(144, 238, 144, 0.5);
            position: relative;
            z-index: 20;
        }

        .ovni {
            position: absolute;
            font-size: 50px;
            animation: volar 15s linear infinite;
            z-index: 10;
        }

        @keyframes volar {
            0% { top: 50px; left: 0px; }
            25% { top: 100px; left: calc(100% - 70px); }
            50% { top: calc(100% - 150px); left: calc(100% - 70px); }
            75% { top: calc(100% - 150px); left: 0px; }
            100% { top: 50px; left: 0px; }
        }

        .luz {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #90EE90;
            border-radius: 50%;
            animation: parpadear 2s alternate infinite;
            z-index: 5;
        }

        .cometa {
            position: absolute;
            width: 4px;
            height: 80px;
            background: linear-gradient(to bottom, white, rgba(255,255,255,0.1));
            border-radius: 50%;
            opacity: 0;
            z-index: 6;
            transform: rotate(45deg);
            box-shadow: 0 0 6px white;
        }

        @keyframes cruzarCometa {
            0% {
                transform: rotate(45deg) translateX(-50px);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: rotate(45deg) translateX(calc(100vw + 100px));
                opacity: 0;
            }
        }

        @keyframes parpadear {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* 🔩 BOTONES ESTILO METÁLICO */
        .contenedor-botones {
            margin-top: 30px;
            position: relative;
            z-index: 20;
        }

        .boton-metal {
            display: inline-block;
            width: 200px;
            margin: 10px;
            padding: 15px 20px;
            background: linear-gradient(145deg, #5a5a5a, #3a3a3a);
            border: 2px solid #777;
            border-radius: 8px;
            color: #f0f0f0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.1),
                0 4px 0 #222;
        }

        .boton-metal:hover {
            background: linear-gradient(145deg, #6a6a6a, #4a4a4a);
            transform: translateY(-2px);
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.15),
                0 6px 8px rgba(0,0,0,0.4);
        }

        .boton-metal:active {
            transform: translateY(2px);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .icono {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <h1>¡Hola Soy Yamil! 🛸👽</h1>
    <p>Lo hice con VS CODE 😎😀</p>

    <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=600&h=400&fit=crop" alt="Espacio">

    <div class="ovni">🛸</div>

    <!-- ⭐ ESTRELLAS ARRIBA DE LA IMAGEN -->
    <div class="luz" style="top: 60px; left: 80px;"></div
