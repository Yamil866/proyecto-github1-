<!DOCTYPE html>
<html>
<head>
    <title>Mi página con OVNI</title>
    <style>
        body {
            background-color: #0b0b2b;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
            color: white;
            overflow: hidden;
            margin: 0;
        }

        h1 {
            color: #ffeb3b;
            font-size: 32px;
        }

        img {
            max-width: 400px;
            border-radius: 10px;
            margin: 20px auto;
            display: block;
        }

        .ovni {
            position: absolute;
            font-size: 50px;
            animation: volar 15s linear infinite;
            z-index: 10;
        }

        @keyframes volar {
            0% { top: 50px; left: 0px; }
            25% { top: 100px; left: calc(100% - 70px); }
            50% { top: calc(100% - 150px); left: calc(100% - 70px); }
            75% { top: calc(100% - 150px); left: 0px; }
            100% { top: 50px; left: 0px; }
        }

        .luz {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #90EE90;
            border-radius: 50%;
            animation: parpadear 2s alternate infinite;
        }

        @keyframes parpadear {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>¡Hola Soy Yamil! 🛸👽</h1>
    <p>Lo hice con VS CODE 😎😀</p>

    <img src="https://picsum.photos/600/400" alt="Imagen bonita">

    <div class="ovni">🛸</div>

    <div class="luz" style="top: 80px; left: 100px;"></div>
    <div class="luz" style="top: 150px; left: 250px; animation-delay: 0.3s;"></div>
    <div class="luz" style="top: 200px; left: 500px; animation-delay: 0.6s;"></div>
    <div class="luz" style="top: 300px; left: 180px; animation-delay: 0.9s;"></div>
    <div class="luz" style="top: 400px; left: 600px; animation-delay: 1.2s;"></div>
    <div class="luz" style="top: 500px; left: 350px; animation-delay: 1.5s;"></div>
</body>
</html>
