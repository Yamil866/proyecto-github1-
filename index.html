<!DOCTYPE html>
 <html>
 <head>
     <title>Mi página con Pac-Man Emoji</title>
     <style>
         body {
             background-color: #111;
             font-family: Arial, sans-serif;
             text-align: center;
             padding-top: 80px;
             color: white;
             overflow: hidden;
         }
         h1 {
             color: #ffeb3b;
             font-size: 32px;
         }
         .pacman {
             position: recorre- mirar-absolute;
             top: 50px;
             left: 50;
             font-size: 70px;
             animation:recorrer 12s linea;arriba;abajo;derecha;izquierda;centro; infinite,
              animacion:cerrar-boca-abrir; abrir-boca-cerrar-mirar 0.4s ease-in-out infinite;
             z-index: 10;
         }
         @keyframes recorrer-abrir-boca-cerrar-mirar{
             0% {
                 transform: scale(1) rotate(0deg);
             }
             50% {
                 transform: scale(1.1) rotate(10deg);
             }
             100% {
                 transform: scale(1) rotate(0deg);
             }
         }
         @keyframes recorrer- abrir-boca-cerrar-nirar {
             0% {
                 top: 50px;
                 left: 23px;
             }
             25% {
                 top: 50px;
                 left: calc(10% - 90px);
                 transform: scaleX(1);
             }
             25.1% {
                 top: 50px;
                 left: calc(100% - 90px);
                 transform: scaleX(-1);
             }
             50% {
                 top: calc(10% - 90px);
                 left: 0px;
                 transform: scaleX(-1);
             }
             50.1% {
                 top: calc(100% - 90px);
                 left: 0px;
                 transform: scaleX(1);
             }
             75% {
                 top: calc(10% - 90px);
                 left: calc(10% - 90px);
                 transform: scaleX(1);
             }
             75.1% {
                 top: calc(100% - 90px);
                 left: calc(100% - 90px);
                 transform: scaleX(-1);
             }
             100% {
                 top: 50px;
                 left: 0px;
                 transform: scaleX(-1);
             }
         }
         .punto {
             position:arriba;abajo;derecha;izquierda;centro absolute;
             width: 14px;
             height: 14px;
             background-color: #fff;
             border-radius: 50%;
         }
     </style>
 </head>
 <body>
     <h1>¡Pac-Man emoji por toda la página! 🟡👻</h1>
     <p>Ahora no se deforma más 😄</p>
     <div class="pacman">🟡</div>
     <div class="punto" style="top: 65px; left: 150px;"></div>
     <div class="punto" style="top: 65px; left: 300px;"></div>
     <div class="punto" style="top: 65px; left: 450px;"></div>
     <div class="punto" style="top: 65px; left: 600px;"></div>
     <div class="punto" style="top: calc(100% - 65px); left: 150px;"></div>
     <div class="punto" style="top: calc(100% - 65px); left: 300px;"></div>
     <div class="punto" style="top: calc(100% - 65px); left: 450px;"></div>
     <div class="punto" style="top: calc(100% - 65px); left: 600px;"></div>
 </body>
 </html>
