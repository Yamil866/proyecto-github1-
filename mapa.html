<!DOCTYPE html>
<html>
<head>
    <title>🗺️ Mapa Galáctico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 100%);
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }
        h1 { color: #ffeb3b; margin-bottom: 40px; text-shadow: 0 0 15px #ffeb3b; }
        .volver {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #aaa;
            text-decoration: none;
            font-size: 16px;
        }
        .galaxia {
            position: relative;
            width: 700px;
            height: 500px;
            margin: 0 auto;
            background: radial-gradient(circle at center, #1a1a4e 0%, #0a0a2e 70%);
            border-radius: 50%;
            border: 3px solid #444;
            box-shadow: inset 0 0 50px rgba(100,150,255,0.1);
        }
        .nivel {
            position: absolute;
            width: 90px;
            height: 90px;
            background: linear-gradient(145deg, #2a2a5a, #1a1a3a);
            border: 3px solid #555;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .nivel:hover { transform: scale(1.1); border-color: #ffeb3b; }
        .nivel.completado {
            background: linear-gradient(145deg, #2a5a2a, #1a3a1a);
            border-color: #4aff4a;
            box-shadow: 0 0 15px rgba(0,255,0,0.3);
        }
        .bandera { font-size: 22px; display: none; }
        .nivel.completado .bandera { display: block; }
        .numero { font-size: 18px; font-weight: bold; }
        .etiqueta { font-size: 10px; margin-top: 3px; }
        .conexion {
            position: absolute;
            background: #333;
            height: 3px;
            transform-origin: left center;
        }
        .conexion.completada { background: #4aff4a; box-shadow: 0 0 5px #4aff4a; }
        .estrellas {
            position: absolute; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
        }
        .estrella {
            position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%;
        }
        .progreso {
            margin-top: 30px; font-size: 20px;
            color: #ffeb3b;
        }
    </style>
</head>
<body>
    <a href="index.html" class="volver">← Volver al Hangar</a>
    <h1>🌌 MAPA DE LA GALAXIA</h1>
    <div class="galaxia" id="mapa"></div>
    <div class="progreso" id="progreso">Misiones completadas: 0 / 5</div>

    <script>
        const misiones = [
            { id: 1, nombre: 'Defensor', x: 120, y: 250, enlace: 'mision1.html' },
            { id: 2, nombre: 'Lunar', x: 260, y: 120, enlace: 'mision2.html' },
            { id: 3, nombre: 'Explorar', x: 400, y: 150, enlace: 'explorar.html' },
            { id: 4, nombre: 'Mapa', x: 550, y: 250, enlace: 'mapa.html' },
            { id: 5, nombre: 'Rescate', x: 330, y: 400, enlace: 'marvin.html' }
        ];
        const conexiones = [[0,1], [1,2], [2,3], [1,4], [2,4]];
        let completadas = JSON.parse(localStorage.getItem('misionesCompletadas') || '[]');

        function dibujarMapa() {
            const mapa = document.getElementById('mapa');
            mapa.innerHTML = '';

            // Estrellas de fondo
            const contenedorEstrellas = document.createElement('div');
            contenedorEstrellas.className = 'estrellas';
            for(let i = 0; i < 150; i++) {
                const estrella = document.createElement('div');
                estrella.className = 'estrella';
                estrella.style.left = Math.random() * 100 + '%';
                estrella.style.top = Math.random() * 100 + '%';
                contenedorEstrellas.appendChild(estrella);
            }
            mapa.appendChild(contenedorEstrellas);

            // Dibujar conexiones
            conexiones.forEach(par => {
                const a = misiones[par[0]];
                const b = misiones[par[1]];
                const linea = document.createElement('div');
                linea.className = 'conexion';
                if(completadas.includes(a.id) && completadas.includes(b.id)) {
                    linea.classList.add('completada');
                }
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const largo = Math.sqrt(dx*dx + dy*dy);
                const angulo = Math.atan2(dy, dx) * 180 / Math.PI;
                linea.style.left = (a.x + 45) + 'px';
                linea.style.top = (a.y + 45) + 'px';
                linea.style.width = largo + 'px';
                linea.style.transform = `rotate(${angulo}deg)`;
                mapa.appendChild(linea);
            });

            // Dibujar misiones
            misiones.forEach(m => {
                const punto = document.createElement('div');
                punto.className = 'nivel';
                if(completadas.includes(m.id)) punto.classList.add('completado');
                punto.style.left = m.x + 'px';
                punto.style.top = m.y + 'px';
                punto.innerHTML = `
                    <span class="bandera">🚩</span>
                    <span class="numero">${m.id}</span>
                    <span class="etiqueta">${m.nombre}</span>
                `;
                punto.onclick = () => {
                    window.location.href = m.enlace;
                };
                mapa.appendChild(punto);
            });

            // Actualizar contador
            document.getElementById('progreso').textContent = 
                'Misiones completadas: ' + completadas.length + ' / 5';
        }

        dibujarMapa();
    </script>
</body>
</html>
