                for(let o of obstaculos) {
                    if(px < o.x + o.w + 30 && px + 30 > o.x - 30 && py < o.y + o.h + 30 && py + 30 > o.y - 30) {
                        posValida = false;
                        break;
                    }
                }
                intentos++;
            }
            partes.push({ x: px, y: py, nombre, recolectada: false });
        });

                ctx.beginPath();

                ctx.fillText(o.tipo, o.x, o.y + 35);
